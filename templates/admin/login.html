{% extends "base.html" %}
{% block title %}PRS 2026 — Admin Login{% endblock %}

{% block content %}
<div class="container" style="max-width:420px;">
  <div style="margin-top:3rem;"></div>
  <div class="card">
    <h2 style="margin-bottom:.5rem;">Admin Panel</h2>
    <p style="color:var(--gray-600); font-size:.9rem; margin-bottom:1.5rem;">
      Enter the administrator password to continue.
    </p>

    {% if error %}
      <div class="alert alert--error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autofocus required />
      </div>
      <button class="btn btn--primary" type="submit" style="width:100%;">Login</button>
    </form>
  </div>
</div>
{% endblock %}
